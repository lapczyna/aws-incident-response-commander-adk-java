# Local stack for the Incident Commander demo.
#
# Brings up PostgreSQL and the fault-injectable target service. The Commander itself is added in
# Phase 3, when it has agents to run.
#
#   docker compose up -d
#   scripts/generate-traffic.sh
#
# Everything here is demo infrastructure: default credentials, no persistence guarantees, and fault
# injection deliberately enabled on the target service. Do not point anything real at it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: commander-postgres
    environment:
      POSTGRES_DB: commander
      POSTGRES_USER: commander
      POSTGRES_PASSWORD: commander
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-demo-target-db.sql:/docker-entrypoint-initdb.d/10-demo-target.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander -d commander"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-target:
    build:
      context: .
      dockerfile: demo-target-service/Dockerfile
    container_name: demo-target-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demotarget
      SPRING_DATASOURCE_USERNAME: demotarget
      SPRING_DATASOURCE_PASSWORD: demotarget
      # Fault injection is on here and only here. Every fault still expires on its own.
      DEMO_FAULTS_ENABLED: "true"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
