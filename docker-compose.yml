# Local stack for the Incident Commander demo.
#
# PostgreSQL, the Commander, and the fault-injectable target service it investigates. This is the
# same image and the same configuration shape that ECS runs in AWS — the difference is the
# datasource URL and where the secrets come from, which is the difference that should exist.
#
#   docker compose up -d
#   scripts/generate-traffic.sh
#
# Everything here is demo infrastructure: default credentials, no persistence guarantees, and fault
# injection deliberately enabled on the target service. Do not point anything real at it.
services:
  postgres:
    image: postgres:17-alpine
    container_name: commander-postgres
    environment:
      POSTGRES_DB: commander
      POSTGRES_USER: commander
      POSTGRES_PASSWORD: commander
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-demo-target-db.sql:/docker-entrypoint-initdb.d/10-demo-target.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander -d commander"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo-target:
    build:
      context: .
      dockerfile: demo-target-service/Dockerfile
    container_name: demo-target-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demotarget
      SPRING_DATASOURCE_USERNAME: demotarget
      SPRING_DATASOURCE_PASSWORD: demotarget
      # Fault injection is on here and only here. Every fault still expires on its own.
      DEMO_FAULTS_ENABLED: "true"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  commander:
    build:
      context: .
      dockerfile: commander-api/Dockerfile
    container_name: incident-commander
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # fake and simulator: no model API key, no AWS credentials, no network calls to a provider.
      # Change to gemini,simulator,local-identity and set GEMINI_API_KEY to run it against a real
      # model, or to fake,aws,local-identity to read live AWS with a scripted model. The choices
      # are independent on purpose — but keep an identity profile in the list, because every
      # security chain the application declares is behind one.
      SPRING_PROFILES_ACTIVE: ${COMMANDER_PROFILES:-fake,simulator,local-identity}
      COMMANDER_DB_URL: jdbc:postgresql://postgres:5432/commander
      COMMANDER_DB_USER: commander
      COMMANDER_DB_PASSWORD: commander
      # The three switches, at their safe defaults, spelled out rather than inherited so that this
      # file shows what a local run can and cannot do.
      COMMANDER_ACTIONS_ENABLED: "false"
      COMMANDER_DRY_RUN: "true"
      COMMANDER_ENVIRONMENT: demo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    # Matches the ECS task definition, so a memory problem shows up locally rather than only on
    # Fargate. MaxRAMPercentage in the image reads this limit.
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
