# Modules are populated progressively across the implementation phases, so during early phases a
# rule can legitimately match zero classes. Failing on that would block the build for the wrong
# reason.
#
# This relaxation has a cost: a mistyped package name would make a rule vacuously true. That hole
# is closed by ArchitectureRulesTest#everyDeclaredLayerIsPopulated, which asserts each layer
# actually contains classes, so a typo fails loudly even though empty-should does not.
archRule.failOnEmptyShould=false
