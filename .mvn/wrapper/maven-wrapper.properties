# Maven Wrapper, generated with -Dtype=only-script.
#
# only-script means no maven-wrapper.jar is needed or committed, so this repository stays
# free of checked-in binaries. The mvnw script downloads the pinned Maven distribution below
# on first use. Note that the jar-based wrapper flavour ignores distributionType entirely and
# will re-download the jar, so this file must stay paired with only-script mvnw scripts.
#
# Maven is pinned to 3.9.16: the newest stable 3.x. 4.0.0-rc-6 is a release candidate.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
